name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages deployments must be allowed to finish.
# Newer pushes may replace pending work, but must not cancel
# an already-running production deployment.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Prepare and build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Sync Library manifest
        run: |
          mkdir -p data

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://raw.githubusercontent.com/Parsaetak/Contents/Projects/library.json" \
            --output data/library.json

      - name: Validate Library manifest
        run: |
          node -e "
          const fs = require('fs');

          const file = 'data/library.json';

          const data = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          if (
            typeof data.version !== 'number' ||
            typeof data.updated !== 'string' ||
            !Array.isArray(data.items)
          ) {
            throw new Error(
              'Invalid Library manifest'
            );
          }

          for (const item of data.items) {
            if (
              typeof item.branch !== 'string' ||
              typeof item.source !== 'string' ||
              typeof item.title !== 'string' ||
              typeof item.type !== 'string'
            ) {
              throw new Error(
                'Invalid Library manifest item'
              );
            }
          }

          console.log(
            'Library manifest valid:',
            data.items.length,
            'items'
          );
          "

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # The blog content pipeline validates every article (required
      # fields, slug format, dates, cover files, internal links, the
      # related-content graph) before the site exists. A malformed
      # article fails the build
      # with the file and the reason instead of silently shipping
      # corrupted content. `npm run build` re-runs the script itself;
      # this step exists to surface content failures with a clear
      # dedicated job step.
      - name: Validate blog content and data pipeline
        run: |
          node scripts/build-blog.mjs

          test -f data/blog/posts.json
          test -f public/sitemap.xml

          # RSS was removed in v2.5 — the pipeline must not emit a feed.
          if [ -f public/blog/feed.xml ]; then
            echo "public/blog/feed.xml must not exist (RSS removed in v2.5)." >&2
            exit 1
          fi

          echo "Blog data pipeline valid."

      - name: Build Next.js site
        run: npm run build

      # Programmatic SEO verification against the exported artifacts:
      # titles, descriptions, canonicals, JSON-LD validity, sitemap/
      # robots contents, RSS absence, and production URL correctness.
      - name: Verify static SEO output
        run: node scripts/verify-seo.mjs

      # Artifact-level validation: the export must actually contain
      # the blog routes and the SEO assets — and must NOT contain the
      # removed RSS feed — before anything is uploaded.
      - name: Verify static export output
        run: |
          set -euo pipefail

          test -f out/index.html
          test -f out/blog/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/og-default.png

          if [ -f out/blog/feed.xml ]; then
            echo "out/blog/feed.xml must not exist (RSS removed in v2.5)." >&2
            exit 1
          fi

          grep -q "https://parsaetak.github.io/WEB/sitemap.xml" out/robots.txt

          sitemap_urls="$(grep -c "<loc>" out/sitemap.xml)"
          article_count="$(
            find out/blog -mindepth 1 -maxdepth 1 -type d \
              ! -name images | wc -l
          )"

          # Every article must appear in the sitemap (plus home and
          # the blog index).
          if [ "${sitemap_urls}" -ne $((article_count + 2)) ]; then
            echo "Sitemap/.route mismatch: ${sitemap_urls} sitemap URLs for ${article_count} article(s)." >&2
            exit 1
          fi

          if [ "${article_count}" -eq 0 ]; then
            echo "No blog article pages were exported." >&2
            exit 1
          fi

          echo "Static export verified: blog index, sitemap, robots, and ${article_count} article route(s) present; no feed shipped."

      # This file is deliberately added after the Next.js export.
      # It lets the deploy job verify that GitHub Pages is serving
      # the exact commit that triggered this workflow.
      - name: Write deployment manifest
        env:
          DEPLOYMENT_SHA: ${{ github.sha }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
        run: |
          cat > out/deployment.json <<EOF
          {
            "commit": "${DEPLOYMENT_SHA}",
            "runId": "${DEPLOYMENT_RUN_ID}"
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Deploy site
    needs:
      - build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Do not consider the workflow completely successful merely
      # because deploy-pages accepted the artifact. Verify that the
      # newly deployed revision is actually being served.
      - name: Verify deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          manifest_url="${PAGE_URL%/}/deployment.json?sha=${EXPECTED_SHA}"

          for attempt in $(seq 1 36); do
            response="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --max-time 10 \
                "$manifest_url" \
                2>/dev/null || true
            )"

            if printf '%s' "$response" | grep -Fq "\"commit\": \"$EXPECTED_SHA\""; then
              echo "GitHub Pages is serving commit $EXPECTED_SHA."
              exit 0
            fi

            echo "Deployment not visible yet; verification attempt ${attempt}/36."
            sleep 5
          done

          echo "GitHub Pages accepted the deployment, but the expected commit was not reachable after verification retries."
          exit 1

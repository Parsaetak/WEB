name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Prepare and build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Verify Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"

          http_code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-time 20 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --write-out '%{http_code}' \
              --output "${response_file}" \
              "https://api.github.com/repos/${GH_REPO}/pages"
          )"

          if [ "${http_code}" != "200" ]; then
            echo "::error::Unable to read GitHub Pages configuration (HTTP ${http_code})."
            cat "${response_file}" || true
            exit 1
          fi

          build_type="$(
            node -e '
              const fs = require("fs");
              const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(config.build_type || "legacy");
            ' "${response_file}"
          )"

          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages is configured as '${build_type}'."
            echo "::error::Set Settings -> Pages -> Build and deployment -> Source to 'GitHub Actions'."
            echo "::error::This workflow deploys through actions/deploy-pages and cannot work while Pages uses 'Deploy from a branch'."
            exit 1
          fi

          echo "GitHub Pages source verified: workflow."

      - name: Sync Library manifest
        run: |
          set -euo pipefail

          mkdir -p data

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://raw.githubusercontent.com/Parsaetak/Contents/Projects/library.json" \
            --output data/library.json

      - name: Validate Library manifest
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const file = 'data/library.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (
            typeof data.version !== 'number' ||
            typeof data.updated !== 'string' ||
            !Array.isArray(data.items)
          ) {
            throw new Error('Invalid Library manifest');
          }

          for (const item of data.items) {
            if (
              typeof item.branch !== 'string' ||
              typeof item.source !== 'string' ||
              typeof item.title !== 'string' ||
              typeof item.type !== 'string'
            ) {
              throw new Error('Invalid Library manifest item');
            }
          }

          console.log(
            `Library manifest valid: ${data.items.length} items`
          );
          NODE

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Validate blog content and data pipeline
        run: |
          set -euo pipefail

          node scripts/build-blog.mjs

          test -f data/blog/posts.json
          test -f public/sitemap.xml

          if [ -f public/blog/feed.xml ]; then
            echo "public/blog/feed.xml must not exist (RSS removed in v2.5)." >&2
            exit 1
          fi

          echo "Blog data pipeline valid."

      - name: Build Next.js site
        run: npm run build

      - name: Verify static SEO output
        run: node scripts/verify-seo.mjs

      - name: Verify static export output
        run: |
          set -euo pipefail

          test -f out/index.html
          test -f out/blog/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/og-default.png

          if [ -f out/blog/feed.xml ]; then
            echo "out/blog/feed.xml must not exist (RSS removed in v2.5)." >&2
            exit 1
          fi

          grep -q "https://parsaetak.github.io/WEB/sitemap.xml" out/robots.txt

          sitemap_urls="$(grep -c "<loc>" out/sitemap.xml)"

          article_count="$(
            find out/blog \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              ! -name images \
              | wc -l
          )"

          expected_urls=$((article_count + 2))

          if [ "${sitemap_urls}" -ne "${expected_urls}" ]; then
            echo "Sitemap/route mismatch: ${sitemap_urls} sitemap URLs for ${article_count} article(s)." >&2
            exit 1
          fi

          if [ "${article_count}" -eq 0 ]; then
            echo "No blog article pages were exported." >&2
            exit 1
          fi

          echo "Static export verified: ${article_count} article route(s)."

      - name: Write deployment manifests
        env:
          DEPLOYMENT_SHA: ${{ github.sha }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          cat > out/deployment.json <<EOF
          {
            "commit": "${DEPLOYMENT_SHA}",
            "runId": "${DEPLOYMENT_RUN_ID}"
          }
          EOF

          mkdir -p out/deployments

          cat > "out/deployments/${DEPLOYMENT_SHA}.json" <<EOF
          {
            "commit": "${DEPLOYMENT_SHA}",
            "runId": "${DEPLOYMENT_RUN_ID}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Deploy site
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000

      - name: Verify deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base_url="${PAGE_URL%/}"

          if [ -z "${base_url}" ]; then
            base_url="https://parsaetak.github.io/WEB"
          fi

          verify_url="${base_url}/deployments/${EXPECTED_SHA}.json"

          echo "Verifying ${verify_url}"

          for attempt in $(seq 1 40); do
            body_file="$(mktemp)"

            http_code="$(
              curl \
                --silent \
                --show-error \
                --location \
                --max-time 15 \
                --header 'Cache-Control: no-cache' \
                --header 'Pragma: no-cache' \
                --write-out '%{http_code}' \
                --output "${body_file}" \
                "${verify_url}" 2>/dev/null || echo '000'
            )"

            if \
              [ "${http_code}" = "200" ] &&
              grep -Fq "\"commit\": \"${EXPECTED_SHA}\"" "${body_file}"
            then
              echo "GitHub Pages is serving revision ${EXPECTED_SHA}."
              cat "${body_file}"
              rm -f "${body_file}"
              exit 0
            fi

            rm -f "${body_file}"

            echo \
              "Revision not visible yet: HTTP ${http_code} " \
              "attempt ${attempt}/40."

            sleep 5
          done

          echo "::error::The deployment was accepted, but revision ${EXPECTED_SHA} was not observed publicly."

          exit 1
